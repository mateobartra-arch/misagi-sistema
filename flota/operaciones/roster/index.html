<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roster de Conductores — MISAGI S.A.C.</title>
  <link rel="icon" type="image/png" href="../../../assets/misagi-icon.png">
  <link rel="stylesheet" href="../../../assets/theme.css">
  <style>
    .rosterbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    .rosterbar .mes{font-family:'Space Grotesk';font-weight:600;font-size:1.1rem;color:var(--azul-d);min-width:170px;text-align:center}
    .leg{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px;font-size:.78rem;color:var(--text-secondary)}
    .leg span{display:inline-flex;align-items:center;gap:6px}
    .leg i{width:22px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:.62rem;font-weight:700}
    .rtable-wrap{overflow:auto;border:1px solid var(--border);border-radius:14px;background:#fff;max-height:72vh}
    table.roster{border-collapse:collapse;font-size:.8rem}
    table.roster th,table.roster td{border:1px solid var(--border);text-align:center;white-space:nowrap;padding:0}
    table.roster thead th{position:sticky;top:0;background:var(--bg-subtle);z-index:3;padding:5px 3px;font-weight:700;color:var(--text-muted)}
    table.roster th.dow{font-size:.6rem;line-height:1.1;min-width:34px}
    table.roster th.we,table.roster td.we{background:#f6f7f6}
    table.roster td.name,table.roster th.name{position:sticky;left:0;background:#fff;z-index:2;text-align:left;padding:6px 12px;font-weight:600;width:200px;max-width:200px;overflow:hidden;text-overflow:ellipsis;box-shadow:1px 0 0 var(--border)}
    table.roster thead th.name{z-index:4;background:var(--bg-subtle)}
    table.roster td.cnt{position:sticky;left:200px;background:#fff;z-index:2;font-weight:700;color:var(--verde-d);min-width:44px;box-shadow:1px 0 0 var(--border)}
    table.roster thead th.cnt{z-index:4;background:var(--bg-subtle)}
    input.cinp{width:36px;height:30px;border:none;background:transparent;text-align:center;font-weight:700;font-size:.78rem;color:inherit;text-transform:uppercase;padding:0}
    input.cinp:focus{outline:2px solid var(--verde);outline-offset:-2px}
  </style>
</head>
<body>
  <header class="msg-header">
    <a class="brand" href="../../../index.html" style="text-decoration:none"><span class="brand-mark">M</span> MISAGI · Roster</a>
    <div class="spacer"></div>
    <a class="btn btn-ghost btn-sm" href="../../../index.html">← Portal</a>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Salir</button>
  </header>

  <div class="container" style="padding-bottom:0">
    <div style="display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap">
      <a href="../roster/" style="padding:8px 16px;border-radius:10px 10px 0 0;text-decoration:none;font-weight:600;font-size:.88rem;background:#fff;border:1px solid var(--border);border-bottom-color:#fff;color:var(--verde-d)">📅 Calendario</a>
      <a href="../roster-analisis/" style="padding:8px 16px;border-radius:10px 10px 0 0;text-decoration:none;font-weight:600;font-size:.88rem;color:var(--text-muted)">📊 Días efectivos</a>
      <a href="../roster-dashboard/" style="padding:8px 16px;border-radius:10px 10px 0 0;text-decoration:none;font-weight:600;font-size:.88rem;color:var(--text-muted)">📈 Dashboard</a>
    </div>
  </div>

  <div class="container">
    <div class="page-head">
      <div><h1>Roster de Conductores</h1><div class="page-sub" id="sub">Cargando…</div></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-primary" id="btnImport">Importar del Sheet</button>
        <button class="btn btn-ghost" id="btnAdd">+ Agregar conductor</button>
        <button class="btn btn-ghost" id="btnExport">⬇ Excel</button>
      </div>
    </div>
    <div class="rosterbar">
      <button class="btn btn-ghost btn-sm" id="prev">← Mes anterior</button>
      <span class="mes" id="mes">—</span>
      <button class="btn btn-ghost btn-sm" id="next">Mes siguiente →</button>
      <div style="flex:1"></div>
      <span class="page-sub">Escribe el código en cada día; se guarda solo.</span>
    </div>
    <div class="leg" id="leg"></div>
    <div class="rtable-wrap"><table class="roster" id="tabla"></table></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../../../assets/firebase-config.js"></script>
  <script src="../../../assets/auth.js"></script>
  <script src="../../../assets/xls.js"></script>
  <script src="../../../assets/seed-personal.js"></script>
  <script src="../../../assets/seed-roster.js"></script>
  <script>
    var db=function(){return firebase.firestore();};
    // Códigos (misma idea que el Sheet): D descanso, H1/H2/H3 turnos, P, R1..R5 rutas
    var CODES={
      "D":{bg:"#eef1f3",fg:"#6b7680",t:"Descanso"},
      "P":{bg:"#123a63",fg:"#ffffff",t:"P"},
      "H1":{bg:"#dcf2e4",fg:"#15703f",t:"Horario 1"},
      "H2":{bg:"#d3ecf5",fg:"#0f6c87",t:"Horario 2"},
      "H3":{bg:"#fde0df",fg:"#c5362f",t:"Horario 3"},
      "T1":{bg:"#fdecca",fg:"#97670f",t:"Turno 1"},
      "T2":{bg:"#fbdca2",fg:"#7a5210",t:"Turno 2"},
      "C1":{bg:"#ece1f7",fg:"#6a3fa0",t:"C1"},
      "C2":{bg:"#dcc7f0",fg:"#532a7d",t:"C2"},
      "A1":{bg:"#fde3cf",fg:"#9a531a",t:"A1"},
      "A2":{bg:"#f9cda3",fg:"#82440f",t:"A2"},
      "A3":{bg:"#f3b783",fg:"#6e3909",t:"A3"},
      "R1":{bg:"#e0ecfa",fg:"#1f5fa8",t:"Ruta 1"},
      "R2":{bg:"#bdd6f4",fg:"#1a5398",t:"Ruta 2"},
      "R3":{bg:"#97bdeb",fg:"#134a8c",t:"Ruta 3"},
      "R4":{bg:"#5e95d6",fg:"#ffffff",t:"Ruta 4"},
      "R5":{bg:"#2f6cb5",fg:"#ffffff",t:"Ruta 5"}
    };
    var hoy=new Date(), Y=hoy.getFullYear(), M=hoy.getMonth();
    var CONDUCTORES=[], DATA={};
    function pad(n){return (n<10?"0":"")+n;}
    function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
    function condFiltro(r){return /CONDUCTOR/i.test(String(r.cargo||"")+" "+String(r.departamento||""));}
    function seedConductores(){
      return (window.MISAGI_SEED_PERSONAL||[]).filter(condFiltro).map(function(r){return {dni:String(r.dni),nombre:r.nombre};}).sort(function(a,b){return a.nombre.localeCompare(b.nombre);});
    }
    function nombreMes(){var d=new Date(Y,M,1).toLocaleDateString('es-PE',{month:'long',year:'numeric'});return d.charAt(0).toUpperCase()+d.slice(1);}
    function diasMes(){return new Date(Y,M+1,0).getDate();}
    function fechaDe(d){return Y+"-"+pad(M+1)+"-"+pad(d);}
    function trabajado(code){return code && code!=="D";}

    function pintarLeyenda(){
      document.getElementById("leg").innerHTML=Object.keys(CODES).map(function(k){
        var c=CODES[k]; return '<span><i style="background:'+c.bg+';color:'+c.fg+'">'+k+'</i> '+esc(c.t)+'</span>';
      }).join("")+'<span><i style="background:#fff;border:1px solid var(--border-strong)"></i> Sin marcar</span>';
    }
    function styleInp(inp){
      var v=(inp.value||"").toUpperCase(); var c=CODES[v];
      if(c){ inp.style.background=c.bg; inp.style.color=c.fg; inp.title=c.t; }
      else { inp.style.background=""; inp.style.color="inherit"; inp.title=v?("Código libre: "+v):""; }
    }

    function pintar(){
      document.getElementById("mes").textContent=nombreMes();
      var nd=diasMes(), dows=["D","L","M","M","J","V","S"];
      var head='<thead><tr><th class="name">Conductor</th><th class="cnt">Trab.</th>';
      for(var d=1;d<=nd;d++){ var wd=new Date(Y,M,d).getDay(); var we=(wd===0||wd===6)?" we":""; head+='<th class="dow'+we+'">'+dows[wd]+'<br>'+d+'</th>'; }
      head+='</tr></thead>';
      var body='<tbody>';
      CONDUCTORES.forEach(function(c){
        var trab=0, cells='';
        for(var d=1;d<=nd;d++){
          var f=fechaDe(d), est=DATA[c.dni+"_"+f]||"";
          if(trabajado(est)) trab++;
          var wd=new Date(Y,M,d).getDay(); var we=(wd===0||wd===6)?" we":"";
          cells+='<td class="'+we.trim()+'"><input class="cinp" maxlength="3" data-dni="'+c.dni+'" data-f="'+f+'" data-nom="'+esc(c.nombre)+'" value="'+est+'"></td>';
        }
        body+='<tr><td class="name">'+esc(c.nombre)+'</td><td class="cnt" id="cnt_'+c.dni+'">'+trab+'</td>'+cells+'</tr>';
      });
      body+='</tbody>';
      var t=document.getElementById("tabla"); t.innerHTML=head+body;
      document.getElementById("sub").textContent=CONDUCTORES.length+" conductor(es) · "+nombreMes();
      t.querySelectorAll(".cinp").forEach(styleInp);
    }

    function recuenta(dni){
      var nd=diasMes(), tt=0;
      for(var d=1;d<=nd;d++){ if(trabajado(DATA[dni+"_"+fechaDe(d)])) tt++; }
      var el=document.getElementById("cnt_"+dni); if(el) el.textContent=tt;
    }

    // Delegación: escribir y guardar solo
    document.getElementById("tabla").addEventListener("input",function(e){
      if(!e.target.classList.contains("cinp")) return;
      e.target.value=(e.target.value||"").toUpperCase(); styleInp(e.target);
    });
    document.getElementById("tabla").addEventListener("change",function(e){
      if(!e.target.classList.contains("cinp")) return;
      var inp=e.target, dni=inp.dataset.dni, f=inp.dataset.f, nom=inp.dataset.nom;
      var v=(inp.value||"").toUpperCase().trim(); var key=dni+"_"+f;
      DATA[key]=v; recuenta(dni);
      var ref=db().collection("roster").doc(key);
      if(v){ ref.set({modulo:"roster",dni:dni,nombre:nom,fecha:f,estado:v},{merge:true}).catch(err); }
      else { ref.delete().catch(err); }
      function err(e2){ document.getElementById("sub").textContent="No se pudo guardar (¿reglas publicadas?): "+e2.message; }
    });

    function cargar(){
      DATA={};
      var ini=Y+"-"+pad(M+1)+"-01", fin=Y+"-"+pad(M+1)+"-"+pad(diasMes());
      db().collection("roster").where("fecha",">=",ini).where("fecha","<=",fin).get().then(function(snap){
        snap.forEach(function(doc){ var o=doc.data(); DATA[String(o.dni)+"_"+o.fecha]=o.estado; });
        pintar();
      }).catch(function(e){ pintar(); document.getElementById("sub").textContent="Aviso: no se pudo leer la base ("+e.message+")."; });
    }

    function ordenRef(dni){ var ref=window.MISAGI_SEED_ROSTER_COND||[]; for(var i=0;i<ref.length;i++){ if(String(ref[i].dni)===String(dni)) return i; } return 999; }
    function ordenarCond(arr){ arr.sort(function(a,b){ var oa=(a.orden!=null?a.orden:ordenRef(a.dni)), ob=(b.orden!=null?b.orden:ordenRef(b.dni)); return oa-ob || (a.nombre||"").localeCompare(b.nombre||""); }); return arr; }
    function condInicial(){
      if(window.MISAGI_SEED_ROSTER_COND && MISAGI_SEED_ROSTER_COND.length){ return MISAGI_SEED_ROSTER_COND.map(function(c,i){return {dni:String(c.dni),nombre:c.nombre,orden:i};}); }
      return seedConductores().map(function(c,i){return {dni:c.dni,nombre:c.nombre,orden:i};});
    }
    function cargarConductores(cb){
      // Fuente única: maestro Personas (tipo conductor). Respaldo: lista vieja o semilla.
      db().collection("personas").get().then(function(snap){
        var arr=snap.docs.map(function(d){return d.data();}).filter(function(p){return String(p.tipo||"conductor").toLowerCase()==="conductor";});
        if(arr.length){
          CONDUCTORES=ordenarCond(arr.map(function(o){return {dni:String(o.dni),nombre:o.nombre,orden:ordenRef(o.dni)};}));
          cb(); return;
        }
        db().collection("roster_conductores").get().then(function(s2){
          CONDUCTORES = s2.empty ? condInicial() : ordenarCond(s2.docs.map(function(d){var o=d.data();return {dni:String(o.dni),nombre:o.nombre,orden:o.orden};}));
          cb();
        }).catch(function(){ CONDUCTORES=condInicial(); cb(); });
      }).catch(function(){ CONDUCTORES=condInicial(); cb(); });
    }

    document.getElementById("btnAdd").onclick=function(){
      var nom=prompt("Nombre del conductor (Apellidos, Nombres):"); if(!nom||!nom.trim()) return;
      var dni=prompt("DNI del conductor:"); if(!dni||!dni.trim()) return; dni=dni.trim();
      db().collection("personas").doc(dni).set({dni:dni,nombre:nom.trim(),tipo:"conductor",cargo:"Conductor",activo:true,orden:CONDUCTORES.length},{merge:true}).then(function(){
        cargarConductores(function(){ cargar(); });
      }).catch(function(e){ alert("No se pudo agregar (¿reglas publicadas?): "+e.message); });
    };
    document.getElementById("btnImport").onclick=function(){
      if(!window.MISAGI_SEED_ROSTER){ alert("No se encontró el archivo del roster."); return; }
      if(!confirm("Se cargarán "+MISAGI_SEED_ROSTER.length+" registros (ene–jun 2026) y "+MISAGI_SEED_ROSTER_COND.length+" conductores. ¿Continuar?")) return;
      var btn=this; btn.disabled=true; btn.textContent="Importando…";
      var cb=db().batch();
      MISAGI_SEED_ROSTER_COND.forEach(function(c,i){ cb.set(db().collection("personas").doc(String(c.dni)),{dni:String(c.dni),nombre:c.nombre,tipo:"conductor",cargo:"Conductor",activo:true,orden:i},{merge:true}); });
      cb.commit().then(function(){
        var recs=MISAGI_SEED_ROSTER.slice();
        (function lote(){
          if(!recs.length){ btn.textContent="✓ Importado"; cargarConductores(function(){ cargar(); }); return; }
          var chunk=recs.splice(0,450), b=db().batch();
          chunk.forEach(function(r){ b.set(db().collection("roster").doc(r.dni+"_"+r.fecha),{modulo:"roster",dni:r.dni,nombre:r.nombre,fecha:r.fecha,estado:r.estado},{merge:true}); });
          b.commit().then(function(){ btn.textContent="Importando… ("+recs.length+" restantes)"; lote(); }).catch(function(e){ alert("Error: "+e.message); btn.disabled=false; btn.textContent="Importar del Sheet"; });
        })();
      }).catch(function(e){ alert("Error (conductores): "+e.message+" — ¿reglas publicadas?"); btn.disabled=false; btn.textContent="Importar del Sheet"; });
    };
    document.getElementById("prev").onclick=function(){ M--; if(M<0){M=11;Y--;} cargar(); };
    document.getElementById("next").onclick=function(){ M++; if(M>11){M=0;Y++;} cargar(); };
    document.getElementById("btnExport").onclick=function(){
      var nd=diasMes(), cols=["Conductor","Trabajados"]; for(var d=1;d<=nd;d++) cols.push(String(d));
      var filas=CONDUCTORES.map(function(c){
        var t=0, arr=[c.nombre];
        for(var d=1;d<=nd;d++){ if(trabajado(DATA[c.dni+"_"+fechaDe(d)])) t++; }
        arr.push(t);
        for(var d2=1;d2<=nd;d2++){ arr.push(DATA[c.dni+"_"+fechaDe(d2)]||""); }
        return arr;
      });
      MISAGI_XLS.descargar({nombre:"roster-"+Y+"-"+pad(M+1),hoja:"Roster",titulo:"Roster "+nombreMes(),subtitulo:CONDUCTORES.length+" conductores",columnas:cols,filas:filas});
    };

    MISAGI.requireAccess("operaciones").then(function(s){
      document.getElementById("logoutBtn").onclick=function(){MISAGI.logout();};
      pintarLeyenda();
      cargarConductores(function(){ cargar(); });
    });
  </script>
</body>
</html>
