<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conductores (maestro) — MISAGI S.A.C.</title>
  <link rel="icon" type="image/png" href="../../../assets/misagi-icon.png">
  <link rel="stylesheet" href="../../../assets/theme.css">
  <style>
    .st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
    .st.ok{background:var(--verde-l);color:var(--verde-d)} .st.off{background:var(--danger-light);color:var(--danger)}
    .acts{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
    .imp-bar{display:flex;align-items:center;gap:10px;background:var(--verde-l);border:1px solid rgba(26,107,60,.25);border-radius:12px;padding:12px 14px;margin-bottom:16px}
    .imp-bar .t{flex:1;font-size:.86rem;color:var(--verde-d)}
  </style>
</head>
<body>
  <header class="msg-header">
    <a class="brand" href="../../../index.html" style="text-decoration:none"><span class="brand-mark">M</span> MISAGI · Conductores</a>
    <div class="spacer"></div>
    <a class="btn btn-ghost btn-sm" href="../../../index.html">← Portal</a>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Salir</button>
  </header>
  <div class="container" id="app" style="display:none">
    <div class="page-head">
      <div><h1>Conductores (maestro)</h1><div class="page-sub" id="sub">Cargando…</div></div>
      <div style="display:flex;gap:10px"><button class="btn btn-ghost" id="btnExp">⬇ Excel</button><button class="btn btn-primary" id="btnNew">+ Nuevo conductor</button></div>
    </div>
    <div class="imp-bar hidden" id="impBar"><div class="t">La lista está vacía. ¿Cargar los conductores del roster?</div><button class="btn btn-primary btn-sm" id="btnImp">Importar</button></div>
    <div class="toolbar"><input type="search" id="buscar" placeholder="Buscar por nombre o DNI…"></div>
    <div class="table-wrap"><table id="tabla"><thead><tr><th>Apellidos y nombres</th><th>DNI</th><th>Cargo</th><th>Empresa</th><th>Estado</th><th></th></tr></thead><tbody></tbody></table></div>
    <p class="side-note" style="margin-top:14px">Este es el maestro que alimenta el Roster y los desplegables de conductor en todo el sistema.</p>
  </div>

  <div id="modal" class="modal-overlay hidden">
    <div class="modal-box" style="max-width:480px">
      <div class="modal-head"><h3 id="mtit">Nuevo conductor</h3><button class="modal-x" id="mx">✕</button></div>
      <form id="form">
        <div class="field"><label>Apellidos y nombres *</label><input name="nombre" required placeholder="Ej. Arapa Choquehuanca, LUIS MIGUEL"></div>
        <div class="field"><label>DNI *</label><input name="dni" inputmode="numeric" required placeholder="Ej. 46557013"></div>
        <div class="field"><label>Cargo</label><input name="cargo" value="Conductor"></div>
        <div class="field"><label>Empresa</label><input name="empresa" placeholder="MISAGI"></div>
        <div class="field"><label style="text-transform:none;letter-spacing:0"><input type="checkbox" name="activo" checked style="width:auto;margin-right:7px">Activo</label></div>
        <div id="err" class="msg-alert error hidden"></div>
        <div style="display:flex;gap:10px;justify-content:space-between;margin-top:6px">
          <button type="button" class="btn btn-danger hidden" id="btnDel">Borrar</button>
          <div style="display:flex;gap:10px;margin-left:auto"><button type="button" class="btn btn-ghost" id="cancel">Cancelar</button><button type="submit" class="btn btn-primary" id="save">Guardar</button></div>
        </div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../../../assets/firebase-config.js"></script>
  <script src="../../../assets/auth.js"></script>
  <script src="../../../assets/seed-roster.js"></script>
  <script>
    var db=function(){return firebase.firestore();};
    var C=[];
    function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
    function filtradas(){
      var q=(document.getElementById("buscar").value||"").toLowerCase().trim();
      var arr=C.slice().sort(function(a,b){return (a.orden==null?9999:a.orden)-(b.orden==null?9999:b.orden) || String(a.nombre||"").localeCompare(String(b.nombre||""));});
      if(!q) return arr;
      return arr.filter(function(d){return (String(d.nombre||"")+" "+String(d.dni||"")).toLowerCase().indexOf(q)>=0;});
    }
    function pintar(){
      var tb=document.querySelector("#tabla tbody"); var f=filtradas();
      document.getElementById("sub").textContent=C.length+" conductor(es)";
      document.getElementById("impBar").classList.toggle("hidden", C.length>0);
      if(!f.length){ tb.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:24px">Sin conductores. Usa “+ Nuevo”.</td></tr>'; return; }
      tb.innerHTML=f.map(function(d){
        var est=d.activo===false?'<span class="st off">Inactivo</span>':'<span class="st ok">Activo</span>';
        return '<tr><td><strong>'+esc(d.nombre)+'</strong></td><td>'+esc(d.dni)+'</td><td>'+esc(d.cargo||"Conductor")+'</td><td>'+esc(d.empresa||"")+'</td><td>'+est+'</td><td><div class="acts"><button class="btn btn-ghost btn-sm" data-e="'+esc(d.dni)+'">Editar</button></div></td></tr>';
      }).join("");
      tb.querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(){abrir(C.filter(function(x){return String(x.dni)===b.dataset.e;})[0]);};});
    }
    function cargar(){
      db().collection("roster_conductores").get().then(function(snap){
        C=snap.docs.map(function(doc){var o=doc.data();o._id=doc.id;return o;}); pintar();
      }).catch(function(e){ document.getElementById("sub").textContent="Error: "+e.message; });
    }
    function abrir(reg){
      var f=document.getElementById("form"); f.reset();
      document.getElementById("err").classList.add("hidden");
      f.dataset.id=reg?String(reg.dni):"";
      document.getElementById("mtit").textContent=reg?"Editar conductor":"Nuevo conductor";
      document.getElementById("btnDel").classList.toggle("hidden",!reg);
      f.dni.readOnly=!!reg;
      if(reg){ f.nombre.value=reg.nombre||""; f.dni.value=reg.dni||""; f.cargo.value=reg.cargo||"Conductor"; f.empresa.value=reg.empresa||""; f.activo.checked=reg.activo!==false; }
      document.getElementById("modal").classList.remove("hidden");
    }
    function cerrar(){document.getElementById("modal").classList.add("hidden");}
    document.getElementById("form").addEventListener("submit",function(e){
      e.preventDefault(); var f=e.target, err=document.getElementById("err"); err.classList.add("hidden");
      var dni=String(f.dni.value||"").trim(); if(!dni){ err.textContent="El DNI es obligatorio."; err.classList.remove("hidden"); return; }
      var reg={ dni:dni, nombre:f.nombre.value.trim(), cargo:f.cargo.value.trim()||"Conductor", empresa:f.empresa.value.trim(), activo:f.activo.checked };
      if(!f.dataset.id){ reg.orden=C.length; }
      var btn=document.getElementById("save"); btn.disabled=true; btn.textContent="Guardando…";
      db().collection("roster_conductores").doc(dni).set(reg,{merge:true}).then(function(){ btn.disabled=false; btn.textContent="Guardar"; cerrar(); cargar(); })
        .catch(function(e2){ err.textContent=e2.message; err.classList.remove("hidden"); btn.disabled=false; btn.textContent="Guardar"; });
    });
    document.getElementById("btnDel").onclick=function(){
      var id=document.getElementById("form").dataset.id; if(!id) return;
      if(!confirm("¿Borrar este conductor del maestro? (no borra su roster histórico)")) return;
      db().collection("roster_conductores").doc(id).delete().then(function(){ cerrar(); cargar(); });
    };
    document.getElementById("btnImp").onclick=function(){
      var seed=window.MISAGI_SEED_ROSTER_COND||[]; if(!seed.length){ alert("No hay datos para importar."); return; }
      var btn=this; btn.disabled=true; btn.textContent="Importando…";
      var batch=db().batch();
      seed.forEach(function(c,i){ batch.set(db().collection("roster_conductores").doc(String(c.dni)),{dni:String(c.dni),nombre:c.nombre,cargo:"Conductor",activo:true,orden:i},{merge:true}); });
      batch.commit().then(function(){ btn.textContent="✓"; cargar(); }).catch(function(e){ alert("Error: "+e.message); btn.disabled=false; btn.textContent="Importar"; });
    };
    document.getElementById("btnExp").onclick=function(){
      var head=["Apellidos y nombres","DNI","Cargo","Empresa","Estado"].join(";");
      var rows=C.map(function(d){return ['"'+(d.nombre||"")+'"','"'+(d.dni||"")+'"','"'+(d.cargo||"Conductor")+'"','"'+(d.empresa||"")+'"',(d.activo===false?"Inactivo":"Activo")].join(";");});
      var csv="﻿"+head+"\n"+rows.join("\n");
      var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"})); a.download="conductores.csv"; a.click();
    };
    document.getElementById("btnNew").onclick=function(){abrir(null);};
    document.getElementById("buscar").oninput=pintar;
    document.getElementById("mx").onclick=cerrar; document.getElementById("cancel").onclick=cerrar;

    MISAGI.requireAccess("operaciones").then(function(s){
      document.getElementById("logoutBtn").onclick=function(){MISAGI.logout();};
      document.getElementById("app").style.display="";
      cargar();
    });
  </script>
</body>
</html>
