<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker — MISAGI S.A.C.</title>
<link rel="icon" type="image/png" href="../../../assets/misagi-icon.png">
<link rel="stylesheet" href="../../../assets/theme.css">
<style>body{margin:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}.app-frame{flex:1;width:100%;border:none}.gate-msg{display:grid;place-items:center;height:100vh;color:var(--text-muted)}</style>
</head><body>
<header class="msg-header">
<a class="brand" href="../../../index.html" style="text-decoration:none"><span class="brand-mark">M</span> MISAGI · Tracker</a>
<div class="spacer"></div>
<a class="btn btn-ghost btn-sm" href="../../../index.html">← Portal</a>
<button class="btn btn-ghost btn-sm" id="logoutBtn">Salir</button>
</header>
<div id="gate" class="gate-msg">Verificando acceso…</div>
<iframe id="appFrame" class="app-frame hidden" title="Tracker"></iframe>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../../../assets/firebase-config.js"></script>
<script src="../../../assets/auth.js"></script>
<script>
MISAGI.requireAccess("operaciones").then(function(){
  document.getElementById("gate").classList.add("hidden");
  var f=document.getElementById("appFrame"); f.src="app/index.html"; f.classList.remove("hidden");
  document.getElementById("logoutBtn").onclick=function(){MISAGI.logout();};
});
</script>
</body></html>
