<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión Documentaria — MISAGI S.A.C.</title>
  <link rel="icon" type="image/png" href="../assets/misagi-icon.png">
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    .st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
    .st.ok{background:var(--verde-l);color:var(--verde-d)} .st.warn{background:var(--amber-l);color:var(--amber)} .st.bad{background:var(--danger-light);color:var(--danger)} .st.none{background:#eef2f0;color:var(--text-muted)}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .chip{border:1px solid var(--border-strong);background:#fff;border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:600;color:var(--text-secondary);cursor:pointer}
    .chip.on{background:var(--azul-d);color:#fff;border-color:var(--azul-d)}
    .lnk{color:var(--azul);font-weight:600;font-size:.85rem;text-decoration:underline}
    .acts{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
  </style>
</head>
<body>
  <header class="msg-header">
    <a class="brand" href="../index.html" style="text-decoration:none"><span class="brand-mark">M</span> MISAGI · Documentos</a>
    <div class="spacer"></div>
    <a class="btn btn-ghost btn-sm" href="../index.html">← Portal</a>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Salir</button>
  </header>

  <div class="container" id="app" style="display:none">
    <div class="page-head">
      <div><h1>Gestión Documentaria</h1><div class="page-sub" id="sub">Cargando…</div></div>
      <div style="display:flex;gap:10px"><button class="btn btn-ghost" id="btnExp">⬇ Excel</button><button class="btn btn-primary" id="btnNew">+ Nuevo documento</button></div>
    </div>
    <div class="kpis-reg">
      <div class="kpi-card"><div class="kpi-v" id="kTot">—</div><div class="kpi-l">Documentos</div></div>
      <div class="kpi-card"><div class="kpi-v" id="kWarn" style="color:var(--amber)">—</div><div class="kpi-l">Por vencer (≤30 d)</div></div>
      <div class="kpi-card"><div class="kpi-v" id="kBad" style="color:var(--danger)">—</div><div class="kpi-l">Vencidos</div></div>
    </div>
    <div class="chips" id="chips">
      <span class="chip on" data-f="todos">Todos</span>
      <span class="chip" data-f="vencidos">Vencidos</span>
      <span class="chip" data-f="porvencer">Por vencer</span>
      <span class="chip" data-f="Unidad">Unidades</span>
      <span class="chip" data-f="Conductor">Conductores</span>
    </div>
    <div class="toolbar"><input type="search" id="buscar" placeholder="Buscar por placa, conductor, tipo…"></div>
    <div class="table-wrap"><table id="tabla"><thead><tr>
      <th>Pertenece a</th><th>Categoría</th><th>Documento</th><th>N°</th><th>Vencimiento</th><th>Archivo</th><th></th>
    </tr></thead><tbody></tbody></table></div>
    <p class="side-note" style="margin-top:14px" id="note"></p>
  </div>

  <div id="modal" class="modal-overlay hidden">
    <div class="modal-box" style="max-width:540px">
      <div class="modal-head"><h3 id="mtit">Nuevo documento</h3><button class="modal-x" id="mx">✕</button></div>
      <form id="form">
        <div class="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px">
          <div class="field"><label>Categoría *</label><select name="categoria" id="cat"><option value="Unidad">Unidad</option><option value="Conductor">Conductor</option></select></div>
          <div class="field"><label id="lblEnt">Placa de la unidad *</label><input name="entidad" required placeholder="Ej. CFF-841"></div>
          <div class="field"><label>Tipo de documento *</label><select name="tipo" id="tipo"></select></div>
          <div class="field"><label>N° / Código</label><input name="numero"></div>
          <div class="field"><label>Fecha de emisión</label><input name="emision" type="date"></div>
          <div class="field"><label>Fecha de vencimiento</label><input name="vencimiento" type="date"></div>
        </div>
        <div class="field"><label>Archivo (PDF o imagen)</label><input name="archivo" type="file" accept=".pdf,image/*"><div class="side-note" id="curFile" style="margin-top:5px"></div></div>
        <div class="field"><label>Observación</label><textarea name="obs" rows="2"></textarea></div>
        <div id="err" class="msg-alert error hidden"></div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px"><button type="button" class="btn btn-ghost" id="cancel">Cancelar</button><button type="submit" class="btn btn-primary" id="save">Guardar</button></div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="../assets/firebase-config.js"></script>
  <script src="../assets/auth.js"></script>
  <script>
    var db=function(){return firebase.firestore();};
    var DOCS=[], filtro="todos";
    var TIPOS={
      Unidad:["SOAT","Revisión Técnica","Tarjeta de propiedad","Habilitación MTC","Póliza","Tarjeta de circulación","Otro"],
      Conductor:["Licencia","DNI","EMO / Examen médico","Contrato","Homologación Hudbay","Homologación Raciemsa","Homologación Mepsa","SCTR","Récord de conductor","Otro"]
    };
    function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
    function estadoVenc(v){
      if(!v) return {cls:"none",txt:"Sin vencimiento",dias:null};
      var hoy=new Date(); hoy.setHours(0,0,0,0); var d=new Date(v+"T00:00:00"); if(isNaN(d)) return {cls:"none",txt:esc(v),dias:null};
      var dias=Math.round((d-hoy)/86400000);
      if(dias<0) return {cls:"bad",txt:"Vencido",dias:dias};
      if(dias<=30) return {cls:"warn",txt:"Vence "+dias+" d",dias:dias};
      return {cls:"ok",txt:"Vigente",dias:dias};
    }
    function llenarTipos(cat,sel){
      document.getElementById("tipo").innerHTML=(TIPOS[cat]||[]).map(function(t){return '<option'+(sel===t?" selected":"")+'>'+esc(t)+'</option>';}).join("");
      document.getElementById("lblEnt").textContent = cat==="Unidad" ? "Placa de la unidad *" : "Conductor (nombre o DNI) *";
    }

    function filtradas(){
      var q=(document.getElementById("buscar").value||"").toLowerCase().trim();
      return DOCS.filter(function(d){
        if(filtro==="Unidad"||filtro==="Conductor"){ if(d.categoria!==filtro) return false; }
        else if(filtro==="vencidos"){ if(estadoVenc(d.vencimiento).cls!=="bad") return false; }
        else if(filtro==="porvencer"){ if(estadoVenc(d.vencimiento).cls!=="warn") return false; }
        if(q) return (String(d.entidad||"")+" "+String(d.tipo||"")+" "+String(d.numero||"")).toLowerCase().indexOf(q)>=0;
        return true;
      }).sort(function(a,b){ return String(a.vencimiento||"9999").localeCompare(String(b.vencimiento||"9999")); });
    }
    function pintar(){
      var tb=document.querySelector("#tabla tbody"); var f=filtradas();
      document.getElementById("kTot").textContent=DOCS.length;
      document.getElementById("kWarn").textContent=DOCS.filter(function(d){return estadoVenc(d.vencimiento).cls==="warn";}).length;
      document.getElementById("kBad").textContent=DOCS.filter(function(d){return estadoVenc(d.vencimiento).cls==="bad";}).length;
      document.getElementById("sub").textContent=DOCS.length+" documento(s)";
      if(!f.length){ tb.innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:24px">Sin documentos.</td></tr>'; return; }
      tb.innerHTML=f.map(function(d){
        var e=estadoVenc(d.vencimiento);
        var arch=d.archivo_url?'<a class="lnk" href="'+esc(d.archivo_url)+'" target="_blank" rel="noopener noreferrer">ver ↗</a>':'<span style="color:var(--text-muted)">—</span>';
        return '<tr><td><strong>'+esc(d.entidad)+'</strong></td><td>'+esc(d.categoria)+'</td><td>'+esc(d.tipo)+'</td><td>'+esc(d.numero||"")+'</td>'+
          '<td>'+(d.vencimiento?esc(d.vencimiento)+' ':'')+'<span class="st '+e.cls+'">'+e.txt+'</span></td><td>'+arch+'</td>'+
          '<td><div class="acts"><button class="btn btn-ghost btn-sm" data-e="'+d._id+'">Editar</button><button class="btn btn-ghost btn-sm" data-d="'+d._id+'">✕</button></div></td></tr>';
      }).join("");
      tb.querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(){abrir(DOCS.filter(function(x){return x._id===b.dataset.e;})[0]);};});
      tb.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){borrar(b.dataset.d);};});
    }
    function cargar(){
      db().collection("documentos").get().then(function(snap){
        DOCS=snap.docs.map(function(doc){var o=doc.data();o._id=doc.id;return o;});
        pintar();
      }).catch(function(e){ document.getElementById("sub").textContent="Error: "+e.message; });
    }

    function abrir(reg){
      var f=document.getElementById("form"); f.reset();
      document.getElementById("err").classList.add("hidden");
      f.dataset.id=reg?reg._id:""; f.dataset.url=reg&&reg.archivo_url?reg.archivo_url:""; f.dataset.fname=reg&&reg.archivo_nombre?reg.archivo_nombre:"";
      document.getElementById("mtit").textContent=reg?"Editar documento":"Nuevo documento";
      var cat=reg?reg.categoria:"Unidad"; f.categoria.value=cat; llenarTipos(cat, reg?reg.tipo:null);
      if(reg){ ["entidad","numero","emision","vencimiento","obs"].forEach(function(k){ if(reg[k]!=null) f[k].value=reg[k]; }); }
      document.getElementById("curFile").textContent = (reg&&reg.archivo_nombre)?("Archivo actual: "+reg.archivo_nombre+" (sube otro para reemplazar)"):"";
      document.getElementById("modal").classList.remove("hidden");
    }
    function cerrar(){document.getElementById("modal").classList.add("hidden");}
    document.getElementById("cat").addEventListener("change",function(){ llenarTipos(this.value,null); });

    document.getElementById("form").addEventListener("submit",function(e){
      e.preventDefault(); var f=e.target, err=document.getElementById("err"); err.classList.add("hidden");
      var reg={ categoria:f.categoria.value, entidad:f.entidad.value.trim(), tipo:f.tipo.value, numero:f.numero.value.trim(),
                emision:f.emision.value, vencimiento:f.vencimiento.value, obs:f.obs.value.trim(),
                archivo_url:f.dataset.url||"", archivo_nombre:f.dataset.fname||"" };
      if(!reg.entidad){ err.textContent="Indica a quién pertenece (placa o conductor)."; err.classList.remove("hidden"); return; }
      var btn=document.getElementById("save"); btn.disabled=true; btn.textContent="Guardando…";
      var file=f.archivo.files[0];
      function persist(){
        reg._ts=firebase.firestore.FieldValue.serverTimestamp();
        var op=f.dataset.id?db().collection("documentos").doc(f.dataset.id).set(reg,{merge:true}):db().collection("documentos").add(reg);
        op.then(function(){ btn.disabled=false; btn.textContent="Guardar"; cerrar(); cargar(); })
          .catch(function(e2){ err.textContent=e2.message; err.classList.remove("hidden"); btn.disabled=false; btn.textContent="Guardar"; });
      }
      if(file){
        btn.textContent="Subiendo archivo…";
        var ref=firebase.storage().ref().child("documentos/"+Date.now()+"_"+file.name.replace(/[^\w.\-]/g,"_"));
        ref.put(file).then(function(snap){ return snap.ref.getDownloadURL(); }).then(function(url){
          reg.archivo_url=url; reg.archivo_nombre=file.name; persist();
        }).catch(function(e2){ err.textContent="No se pudo subir el archivo: "+e2.message+" (¿Storage activado?)"; err.classList.remove("hidden"); btn.disabled=false; btn.textContent="Guardar"; });
      } else { persist(); }
    });
    function borrar(id){ if(!confirm("¿Borrar este documento?")) return; db().collection("documentos").doc(id).delete().then(cargar); }

    document.getElementById("chips").addEventListener("click",function(e){
      if(!e.target.classList.contains("chip")) return;
      document.querySelectorAll(".chip").forEach(function(c){c.classList.remove("on");});
      e.target.classList.add("on"); filtro=e.target.dataset.f; pintar();
    });
    document.getElementById("btnExp").onclick=function(){
      var cols=["entidad","categoria","tipo","numero","emision","vencimiento","obs","archivo_url"];
      var head=["Pertenece","Categoría","Tipo","N°","Emisión","Vencimiento","Observación","Archivo"].join(";");
      var rows=DOCS.map(function(d){return cols.map(function(k){return '"'+String(d[k]==null?"":d[k]).replace(/"/g,'""')+'"';}).join(";");});
      var csv="﻿"+head+"\n"+rows.join("\n");
      var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"})); a.download="documentos.csv"; a.click();
    };
    document.getElementById("btnNew").onclick=function(){abrir(null);};
    document.getElementById("buscar").oninput=pintar;
    document.getElementById("mx").onclick=cerrar; document.getElementById("cancel").onclick=cerrar;

    MISAGI.requireLogin().then(function(s){
      var p=s.perfil;
      if(!(MISAGI.esAdmin(p)||MISAGI.puedeVer(p,"operaciones")||MISAGI.puedeVer(p,"rrhh"))){ alert("No tienes acceso a este módulo."); location.href="../index.html"; return; }
      document.getElementById("logoutBtn").onclick=function(){MISAGI.logout();};
      document.getElementById("app").style.display="";
      document.getElementById("note").textContent="Los archivos se guardan en MISAGI (Firebase Storage). Verde = vigente, ámbar = por vencer (≤30 d), rojo = vencido.";
      cargar();
    });
  </script>
</body>
</html>
