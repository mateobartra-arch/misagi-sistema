<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña — MISAGI S.A.C.</title>
  <link rel="icon" type="image/png" href="../assets/misagi-icon.png">
  <link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
  <header class="msg-header">
    <span class="brand"><span class="brand-mark">M</span> MISAGI</span>
    <div class="spacer"></div>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Salir</button>
  </header>
  <div class="container" style="max-width:460px;margin-top:40px" id="app" style="display:none">
    <div class="card">
      <h1 style="font-size:1.25rem;margin:0 0 6px">Cambia tu contraseña</h1>
      <p class="page-sub" style="margin-bottom:18px">Por seguridad, en tu primer ingreso debes reemplazar la contraseña inicial (tu DNI) por una personal.</p>
      <form id="form">
        <div class="field"><label>Nueva contraseña</label><input name="p1" type="password" minlength="6" required placeholder="Mínimo 6 caracteres"></div>
        <div class="field"><label>Repite la nueva contraseña</label><input name="p2" type="password" minlength="6" required></div>
        <div id="err" class="msg-alert error hidden"></div>
        <button type="submit" class="btn btn-primary" id="btn" style="width:100%">Guardar y entrar</button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../assets/firebase-config.js"></script>
  <script src="../assets/auth.js"></script>
  <script>
    var db=function(){return firebase.firestore();};
    MISAGI.requireLogin().then(function(s){
      document.getElementById("app").style.display="";
      document.getElementById("logoutBtn").onclick=function(){MISAGI.logout();};
      document.getElementById("form").addEventListener("submit",function(e){
        e.preventDefault();
        var f=e.target, err=document.getElementById("err"); err.classList.add("hidden");
        var p1=f.p1.value, p2=f.p2.value;
        if(p1.length<6){ err.textContent="La contraseña debe tener al menos 6 caracteres."; err.classList.remove("hidden"); return; }
        if(p1!==p2){ err.textContent="Las contraseñas no coinciden."; err.classList.remove("hidden"); return; }
        if(p1===String(s.perfil.dni||"")){ err.textContent="No puede ser igual a tu DNI. Elige una distinta."; err.classList.remove("hidden"); return; }
        var btn=document.getElementById("btn"); btn.disabled=true; btn.textContent="Guardando…";
        s.user.updatePassword(p1).then(function(){
          return db().collection("usuarios").doc(s.user.uid).set({debeCambiarClave:false},{merge:true});
        }).then(function(){
          location.href="../index.html";
        }).catch(function(e2){
          btn.disabled=false; btn.textContent="Guardar y entrar";
          err.textContent = e2.code==="auth/requires-recent-login" ? "Por seguridad, vuelve a iniciar sesión y cambia la contraseña." : e2.message;
          err.classList.remove("hidden");
        });
      });
    });
  </script>
</body>
</html>
