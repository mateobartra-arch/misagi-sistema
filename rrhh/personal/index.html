<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal / Conductores — MISAGI S.A.C.</title>
  <link rel="icon" type="image/png" href="../../assets/misagi-icon.png">
  <link rel="stylesheet" href="../../assets/theme.css">
  <style>
    .st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
    .st.ok{background:var(--verde-l);color:var(--verde-d)} .st.warn{background:var(--amber-l);color:var(--amber)} .st.bad{background:var(--danger-light);color:var(--danger)} .st.none{background:#eef2f0;color:var(--text-muted)}
    .acts{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
    @media(max-width:560px){.grid2{grid-template-columns:1fr}}
    .lnk{color:var(--azul);font-weight:600;text-decoration:underline;font-size:.85rem}
  </style>
</head>
<body>
  <header class="msg-header">
    <a class="brand" href="../../index.html" style="text-decoration:none"><span class="brand-mark">M</span> MISAGI · Personal</a>
    <div class="spacer"></div>
    <a class="btn btn-ghost btn-sm" href="../../index.html">← Portal</a>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Salir</button>
  </header>

  <div class="container">
    <div class="page-head">
      <div><h1>Personal / Conductores</h1><div class="page-sub" id="sub">Cargando…</div></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" id="btnExport">⬇ Descargar (Excel)</button>
        <button class="btn btn-primary" id="btnNuevo">+ Nuevo</button>
      </div>
    </div>
    <div class="toolbar"><input type="search" id="buscar" placeholder="Buscar por nombre, DNI, cargo…"></div>
    <div class="table-wrap">
      <table id="tabla">
        <thead><tr>
          <th>Nombre</th><th>DNI</th><th>Tipo</th><th>Licencia</th><th>Homologado</th><th>EMO</th><th>Contrato</th><th>Estado</th><th></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div id="modal" class="modal-overlay hidden">
    <div class="modal-box" style="max-width:600px">
      <div class="modal-head"><h3 id="modalTit">Nuevo</h3><button class="modal-x" id="modalX">✕</button></div>
      <form id="form">
        <div class="grid2">
          <div class="field"><label>Nombre completo *</label><input name="nombre" required></div>
          <div class="field"><label>DNI</label><input name="dni"></div>
          <div class="field"><label>Tipo</label><select name="tipo"><option>Conductor</option><option>Administrativo</option></select></div>
          <div class="field"><label>Cargo</label><input name="cargo"></div>
          <div class="field"><label>Licencia N°</label><input name="licencia"></div>
          <div class="field"><label>Categoría licencia</label><select name="licencia_cat"><option value=""></option><option>A-I</option><option>A-IIa</option><option>A-IIb</option><option>A-IIIa</option><option>A-IIIb</option><option>A-IIIc</option></select></div>
          <div class="field"><label>¿Homologado?</label><select name="homologado"><option>No</option><option>Sí</option></select></div>
          <div class="field"><label>Operaciones homologadas</label><input name="operaciones" placeholder="ej. cisterna, carga peligrosa"></div>
          <div class="field"><label>Banco</label><input name="banco"></div>
          <div class="field"><label>Cuenta de abono</label><input name="cuenta"></div>
          <div class="field"><label>Vencimiento EMO</label><input name="fecha_emo" type="date"></div>
          <div class="field"><label>Teléfono</label><input name="telefono"></div>
          <div class="field"><label>Estado</label><select name="estado"><option>Activo</option><option>Vacaciones</option><option>Suspendido</option><option>Cesado</option></select></div>
          <div class="field"><label>Contrato (enlace al PDF)</label><input name="contrato_url" placeholder="https://… (PDF escaneado)"></div>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
          <button type="button" class="btn btn-ghost" id="cancelar">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../../assets/firebase-config.js"></script>
  <script src="../../assets/auth.js"></script>
  <script>
    var db = function(){ return firebase.firestore(); };
    var COL = "rrhh", MOD = "personal";
    var CAMPOS = ["nombre","dni","tipo","cargo","licencia","licencia_cat","homologado","operaciones","banco","cuenta","fecha_emo","telefono","estado","contrato_url"];
    var sesion = null, datos = [];

    function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

    function emoBadge(f){
      if(!f) return '<span class="st none">—</span>';
      var hoy = new Date(); hoy.setHours(0,0,0,0);
      var d = new Date(f+"T00:00:00"); var dias = Math.round((d-hoy)/86400000);
      if(dias < 0) return '<span class="st bad">Vencido</span>';
      if(dias <= 30) return '<span class="st warn">Vence '+dias+'d</span>';
      return '<span class="st ok">Vigente</span>';
    }
    function estadoBadge(e){
      var cls = e==="Activo"?"ok":(e==="Cesado"||e==="Suspendido"?"bad":"warn");
      return '<span class="st '+cls+'">'+esc(e||"—")+'</span>';
    }

    function filtradas(){
      var q=(document.getElementById("buscar").value||"").toLowerCase().trim();
      if(!q) return datos;
      return datos.filter(function(d){ return CAMPOS.some(function(c){ return String(d[c]||"").toLowerCase().indexOf(q)>=0; }); });
    }
    function pintar(){
      var tb=document.querySelector("#tabla tbody"); var f=filtradas();
      document.getElementById("sub").textContent = datos.length+" registro(s)";
      if(!f.length){ tb.innerHTML='<tr><td colspan="9" style="color:var(--text-muted);padding:26px;text-align:center">Sin registros. Usa “+ Nuevo”.</td></tr>'; return; }
      tb.innerHTML = f.map(function(d){
        var lic = esc(d.licencia||"") + (d.licencia_cat? " ("+esc(d.licencia_cat)+")":"");
        var homo = d.homologado==="Sí" ? '<span class="st ok">Sí</span>'+(d.operaciones? ' <span style="color:var(--text-muted);font-size:.8rem">'+esc(d.operaciones)+'</span>':'') : '<span class="st none">No</span>';
        var contrato = d.contrato_url ? '<a class="lnk" href="'+esc(d.contrato_url)+'" target="_blank" rel="noopener">Ver PDF</a>' : '<span style="color:var(--text-muted)">—</span>';
        return '<tr><td><strong>'+esc(d.nombre)+'</strong><br><span style="color:var(--text-muted);font-size:.8rem">'+esc(d.cargo||"")+'</span></td>'+
          '<td>'+esc(d.dni||"")+'</td><td>'+esc(d.tipo||"")+'</td><td>'+lic+'</td><td>'+homo+'</td><td>'+emoBadge(d.fecha_emo)+'</td><td>'+contrato+'</td><td>'+estadoBadge(d.estado)+'</td>'+
          '<td><div class="acts"><button class="btn btn-ghost btn-sm" data-e="'+d._id+'">Editar</button><button class="btn btn-ghost btn-sm" data-d="'+d._id+'">🗑</button></div></td></tr>';
      }).join("");
      tb.querySelectorAll("[data-e]").forEach(function(b){ b.onclick=function(){ abrir(datos.filter(function(x){return x._id===b.dataset.e;})[0]); }; });
      tb.querySelectorAll("[data-d]").forEach(function(b){ b.onclick=function(){ borrar(b.dataset.d); }; });
    }

    function cargar(){
      db().collection(COL).where("modulo","==",MOD).get().then(function(snap){
        datos = snap.docs.map(function(doc){ var o=doc.data(); o._id=doc.id; return o; })
          .sort(function(a,b){ return (a.nombre||"").localeCompare(b.nombre||""); });
        pintar();
      });
    }

    function abrir(reg){
      var f=document.getElementById("form"); f.reset();
      document.getElementById("modalTit").textContent = reg ? "Editar — "+(reg.nombre||"") : "Nuevo registro";
      CAMPOS.forEach(function(c){ if(f[c]!==undefined && reg) f[c].value = reg[c]||""; });
      f.dataset.id = reg ? reg._id : "";
      document.getElementById("modal").classList.remove("hidden");
    }
    function cerrar(){ document.getElementById("modal").classList.add("hidden"); }

    document.getElementById("form").addEventListener("submit", function(e){
      e.preventDefault();
      var f=e.target, data={ modulo:MOD, _por: sesion.user.email };
      CAMPOS.forEach(function(c){ if(f[c]!==undefined) data[c]=f[c].value; });
      var id=f.dataset.id;
      var op = id ? db().collection(COL).doc(id).set(data,{merge:true})
                  : db().collection(COL).add(Object.assign({_ts:firebase.firestore.FieldValue.serverTimestamp()},data));
      op.then(function(){ cerrar(); cargar(); }).catch(function(err){ alert("No se pudo guardar: "+err.message); });
    });
    function borrar(id){ if(!confirm("¿Eliminar este registro?")) return;
      db().collection(COL).doc(id).delete().then(cargar).catch(function(err){ alert(err.message); }); }

    function exportar(){
      var cols=["nombre","dni","tipo","cargo","licencia","licencia_cat","homologado","operaciones","banco","cuenta","fecha_emo","telefono","estado","contrato_url"];
      var head=["Nombre","DNI","Tipo","Cargo","Licencia","Categoria","Homologado","Operaciones","Banco","Cuenta de abono","Vence EMO","Telefono","Estado","Contrato URL"];
      var rows=[head].concat(datos.map(function(d){ return cols.map(function(c){ return '"'+String(d[c]==null?"":d[c]).replace(/"/g,'""')+'"'; }); }));
      var csv="﻿"+rows.map(function(r){return r.join(",");}).join("\r\n");
      var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
      var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
      a.download="personal_misagi_"+new Date().toISOString().slice(0,10)+".csv"; a.click();
    }

    document.getElementById("btnNuevo").onclick=function(){ abrir(null); };
    document.getElementById("btnExport").onclick=exportar;
    document.getElementById("buscar").oninput=pintar;
    document.getElementById("modalX").onclick=cerrar;
    document.getElementById("cancelar").onclick=cerrar;

    MISAGI.requireAccess("rrhh").then(function(s){
      sesion=s;
      document.getElementById("logoutBtn").onclick=function(){ MISAGI.logout(); };
      cargar();
    });
  </script>
</body>
</html>
