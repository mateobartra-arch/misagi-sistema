<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesos del Personal — MISAGI S.A.C.</title>
  <link rel="icon" type="image/png" href="../../assets/misagi-icon.png">
  <link rel="stylesheet" href="../../assets/theme.css">
  <style>
    .st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
    .st.on{background:var(--verde-l);color:var(--verde-d)} .st.off{background:var(--danger-light);color:var(--danger)}
    .areas-chk{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:6px}
    .areas-chk label{display:flex;align-items:center;gap:7px;font-size:.88rem;font-weight:500;color:var(--text-primary);text-transform:none;letter-spacing:0}
    .areas-chk input{width:auto;margin:0}
    .tags{display:flex;flex-wrap:wrap;gap:5px}
    .tag{background:var(--azul-l);color:var(--azul-d);font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px}
    .tag.adm{background:#fde9c8;color:#8a5310}
    .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
  </style>
</head>
<body>
  <header class="msg-header">
    <a class="brand" href="../../index.html" style="text-decoration:none"><span class="brand-mark">M</span> MISAGI · Accesos</a>
    <div class="spacer"></div>
    <a class="btn btn-ghost btn-sm" href="../../index.html">← Portal</a>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Salir</button>
  </header>

  <div class="container">
    <div class="page-head">
      <div><h1>Accesos del Personal</h1><div class="page-sub" id="sub">Cargando…</div></div>
      <button class="btn btn-primary" id="btnNuevo">+ Nuevo acceso</button>
    </div>
    <div class="toolbar"><input type="search" id="buscar" placeholder="Buscar por nombre o correo…"></div>
    <div class="table-wrap">
      <table id="tabla"><thead><tr>
        <th>Nombre</th><th>Correo</th><th>Tipo</th><th>Áreas</th><th>Estado</th><th></th>
      </tr></thead><tbody></tbody></table>
    </div>
    <p class="side-note" style="margin-top:14px">La contraseña que pongas es temporal: el trabajador puede cambiarla luego. “Desactivar” le quita el acceso al instante. Borrar definitivamente una cuenta se hace desde la consola de Firebase.</p>
  </div>

  <div id="modal" class="modal-overlay hidden">
    <div class="modal-box" style="max-width:520px">
      <div class="modal-head"><h3 id="modalTit">Nuevo acceso</h3><button class="modal-x" id="modalX">✕</button></div>
      <form id="form">
        <div class="field"><label>Nombre completo *</label><input name="nombre" required></div>
        <div class="field"><label>Correo *</label><input name="email" type="email" required></div>
        <div class="field" id="passField"><label>Contraseña temporal * (mín. 6)</label><input name="password" minlength="6"></div>
        <div class="field"><label>Tipo</label><select name="tipo"><option value="administrativo">Administrativo</option><option value="conductor">Conductor</option></select></div>
        <div class="field"><label>Áreas a las que accede</label>
          <div class="areas-chk" id="areasChk"></div>
        </div>
        <div class="field"><label style="text-transform:none;letter-spacing:0"><input type="checkbox" name="activo" checked style="width:auto;margin-right:7px">Cuenta activa</label></div>
        <div id="formErr" class="msg-alert error hidden"></div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
          <button type="button" class="btn btn-ghost" id="cancelar">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btnGuardar">Crear acceso</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../../assets/firebase-config.js"></script>
  <script src="../../assets/auth.js"></script>
  <script>
    var AREAS = [
      ["admin","Administrador (todo)"],["operaciones","Operaciones"],["mantenimiento","Mantenimiento"],
      ["rrhh","Recursos Humanos"],["finanzas","Finanzas"],["proveedores","Proveedores"],
      ["planificacion","Planificación"],["imagen","Imagen Institucional"]
    ];
    var db=function(){return firebase.firestore();};
    var sesion=null, datos=[];
    function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

    // App secundaria: crea usuarios sin cerrar la sesión del admin
    function altaApp(){
      var ex=firebase.apps.filter(function(a){return a.name==="alta";})[0];
      return ex || firebase.initializeApp(MISAGI_FIREBASE_CONFIG,"alta");
    }

    function pintarAreasChk(sel){
      document.getElementById("areasChk").innerHTML = AREAS.map(function(a){
        return '<label><input type="checkbox" value="'+a[0]+'" '+((sel&&sel.indexOf(a[0])>=0)?"checked":"")+'>'+esc(a[1])+'</label>';
      }).join("");
    }
    function areasSeleccionadas(){
      return Array.prototype.slice.call(document.querySelectorAll("#areasChk input:checked")).map(function(i){return i.value;});
    }

    function filtradas(){
      var q=(document.getElementById("buscar").value||"").toLowerCase().trim();
      if(!q) return datos;
      return datos.filter(function(d){return (String(d.nombre||"")+" "+String(d.email||"")).toLowerCase().indexOf(q)>=0;});
    }
    function pintar(){
      var tb=document.querySelector("#tabla tbody"); var f=filtradas();
      document.getElementById("sub").textContent=datos.length+" cuenta(s)";
      if(!f.length){tb.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:24px">Sin cuentas. Usa “+ Nuevo acceso”.</td></tr>';return;}
      tb.innerHTML=f.map(function(d){
        var areas=(d.areas||[]).map(function(a){return '<span class="tag'+(a==="admin"?" adm":"")+'">'+esc(a)+'</span>';}).join(" ")||'<span style="color:var(--text-muted)">—</span>';
        var est=d.activo===false?'<span class="st off">Inactiva</span>':'<span class="st on">Activa</span>';
        return '<tr><td><strong>'+esc(d.nombre)+'</strong></td><td>'+esc(d.email)+'</td><td>'+esc(d.tipo||"")+'</td><td><div class="tags">'+areas+'</div></td><td>'+est+'</td>'+
          '<td><div class="acts"><button class="btn btn-ghost btn-sm" data-e="'+d._id+'">Editar</button>'+
          '<button class="btn btn-ghost btn-sm" data-t="'+d._id+'">'+(d.activo===false?"Activar":"Desactivar")+'</button>'+
          '<button class="btn btn-ghost btn-sm" data-r="'+esc(d.email)+'">Reset clave</button></div></td></tr>';
      }).join("");
      tb.querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(){abrir(datos.filter(function(x){return x._id===b.dataset.e;})[0]);};});
      tb.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){toggle(b.dataset.t);};});
      tb.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){reset(b.dataset.r);};});
    }
    function cargar(){
      db().collection("usuarios").get().then(function(snap){
        datos=snap.docs.map(function(doc){var o=doc.data();o._id=doc.id;return o;}).sort(function(a,b){return (a.nombre||"").localeCompare(b.nombre||"");});
        pintar();
      });
    }

    function abrir(reg){
      var f=document.getElementById("form"); f.reset();
      document.getElementById("formErr").classList.add("hidden");
      var editar=!!reg; f.dataset.id=editar?reg._id:"";
      document.getElementById("modalTit").textContent=editar?("Editar — "+(reg.nombre||"")):"Nuevo acceso";
      // En edición no se cambia correo ni contraseña desde aquí
      document.getElementById("passField").style.display=editar?"none":"";
      f.password.required=!editar;
      f.email.readOnly=editar;
      if(editar){ f.nombre.value=reg.nombre||""; f.email.value=reg.email||""; f.tipo.value=reg.tipo||"administrativo"; f.activo.checked=reg.activo!==false; }
      pintarAreasChk(editar?reg.areas:[]);
      document.getElementById("btnGuardar").textContent=editar?"Guardar cambios":"Crear acceso";
      document.getElementById("modal").classList.remove("hidden");
    }
    function cerrar(){document.getElementById("modal").classList.add("hidden");}

    document.getElementById("form").addEventListener("submit",function(e){
      e.preventDefault();
      var f=e.target, err=document.getElementById("formErr"); err.classList.add("hidden");
      var perfil={ nombre:f.nombre.value.trim(), email:f.email.value.trim().toLowerCase(),
                   tipo:f.tipo.value, areas:areasSeleccionadas(), activo:f.activo.checked };
      var btn=document.getElementById("btnGuardar"); btn.disabled=true; btn.textContent="Guardando…";
      function fail(m){ err.textContent=m; err.classList.remove("hidden"); btn.disabled=false; btn.textContent="Crear acceso"; }

      if(f.dataset.id){ // EDITAR: solo actualiza el perfil
        db().collection("usuarios").doc(f.dataset.id).set(perfil,{merge:true})
          .then(function(){cerrar();cargar();}).catch(function(e){fail(e.message);});
        return;
      }
      // NUEVO: crea cuenta en Auth con app secundaria, luego el perfil
      var secAuth=altaApp().auth();
      secAuth.createUserWithEmailAndPassword(perfil.email, f.password.value).then(function(cred){
        var uid=cred.user.uid;
        return db().collection("usuarios").doc(uid).set(Object.assign({_ts:firebase.firestore.FieldValue.serverTimestamp()},perfil)).then(function(){ return secAuth.signOut(); });
      }).then(function(){ cerrar(); cargar(); }).catch(function(e){
        var m=e.code==="auth/email-already-in-use"?"Ya existe una cuenta con ese correo.":
              e.code==="auth/weak-password"?"La contraseña debe tener al menos 6 caracteres.":e.message;
        fail(m);
      });
    });

    function toggle(id){
      var u=datos.filter(function(x){return x._id===id;})[0]; if(!u)return;
      db().collection("usuarios").doc(id).set({activo:u.activo===false},{merge:true}).then(cargar);
    }
    function reset(email){
      if(!confirm("¿Enviar correo para restablecer la contraseña a "+email+"?"))return;
      firebase.auth().sendPasswordResetEmail(email).then(function(){alert("Correo de restablecimiento enviado a "+email);}).catch(function(e){alert(e.message);});
    }

    document.getElementById("btnNuevo").onclick=function(){abrir(null);};
    document.getElementById("buscar").oninput=pintar;
    document.getElementById("modalX").onclick=cerrar;
    document.getElementById("cancelar").onclick=cerrar;

    MISAGI.requireAccess("admin").then(function(s){
      sesion=s;
      document.getElementById("logoutBtn").onclick=function(){MISAGI.logout();};
      cargar();
    });
  </script>
</body>
</html>
