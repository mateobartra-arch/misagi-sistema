<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitudes — MISAGI</title>
  <link rel="icon" type="image/png" href="../../assets/misagi-icon.png">
  <link rel="stylesheet" href="../../assets/theme.css">
  <style>
    .st{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
    .st.pend{background:var(--amber-l);color:var(--amber)} .st.ok{background:var(--verde-l);color:var(--verde-d)} .st.no{background:var(--danger-light);color:var(--danger)}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
    .chip{border:1px solid var(--border-strong);background:#fff;border-radius:999px;padding:6px 13px;font-size:.82rem;font-weight:600;color:var(--text-muted);cursor:pointer}
    .chip.on{background:var(--azul-d);color:#fff;border-color:var(--azul-d)}
    .acts{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
  </style>
</head>
<body>
  <header class="msg-header">
    <a class="brand" href="../../index.html" style="text-decoration:none"><span class="brand-mark">M</span> MISAGI · Solicitudes</a>
    <div class="spacer"></div>
    <a class="btn btn-ghost btn-sm" href="../../index.html">← Portal</a>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Salir</button>
  </header>
  <div class="container" id="app" style="display:none">
    <div class="page-head"><div><h1>Bandeja de Solicitudes</h1><div class="page-sub" id="sub">Cargando…</div></div></div>
    <div class="chips" id="chips">
      <span class="chip on" data-f="pendiente">Pendientes</span>
      <span class="chip" data-f="aprobada">Aprobadas</span>
      <span class="chip" data-f="rechazada">Rechazadas</span>
      <span class="chip" data-f="todas">Todas</span>
    </div>
    <div class="table-wrap"><table id="tabla"><thead><tr>
      <th>Trabajador</th><th>Tipo</th><th>Detalle</th><th>Estado</th><th></th>
    </tr></thead><tbody></tbody></table></div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../../assets/firebase-config.js"></script>
  <script src="../../assets/auth.js"></script>
  <script>
    var db=function(){return firebase.firestore();}, SOL=[], filtro="pendiente";
    function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
    function tipoTxt(t){return {vacaciones:"Vacaciones",cambio_datos:"Cambio de datos"}[t]||t;}
    function filtradas(){ var arr=SOL.slice().sort(function(a,b){return (b.ts||0)-(a.ts||0);}); return filtro==="todas"?arr:arr.filter(function(s){return (s.estado||"pendiente")===filtro;}); }
    function pintar(){
      var tb=document.querySelector("#tabla tbody"); var f=filtradas();
      var pend=SOL.filter(function(s){return (s.estado||"pendiente")==="pendiente";}).length;
      document.getElementById("sub").textContent=SOL.length+" solicitud(es) · "+pend+" pendiente(s)";
      if(!f.length){ tb.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:24px">Sin solicitudes.</td></tr>'; return; }
      tb.innerHTML=f.map(function(s){
        var est=(s.estado||"pendiente"); var cl=est==="aprobada"?"ok":(est==="rechazada"?"no":"pend");
        var fecha=s.ts?new Date(s.ts).toLocaleDateString('es-PE'):"";
        var acc = est==="pendiente" ? '<button class="btn btn-primary btn-sm" data-a="'+s._id+'">Aprobar</button> <button class="btn btn-ghost btn-sm" data-r="'+s._id+'">Rechazar</button>' : '<span style="color:var(--text-muted);font-size:.8rem">'+fecha+'</span>';
        return '<tr><td><strong>'+esc(s.nombre||"")+'</strong></td><td>'+esc(tipoTxt(s.tipo))+'</td><td>'+esc(s.detalle||s.titulo||"")+'</td><td><span class="st '+cl+'">'+est+'</span></td><td><div class="acts">'+acc+'</div></td></tr>';
      }).join("");
      tb.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){resolver(b.dataset.a,"aprobada");};});
      tb.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){resolver(b.dataset.r,"rechazada");};});
    }
    function rangoFechas(desde,hasta){ var out=[]; var a=new Date(desde+"T00:00:00"),b=new Date(hasta+"T00:00:00"); if(isNaN(a)||isNaN(b)||b<a) return out; for(var d=new Date(a); d<=b; d.setDate(d.getDate()+1)){ out.push(d.toISOString().slice(0,10)); } return out; }
    function resolver(id,estado){
      var sol=SOL.filter(function(s){return s._id===id;})[0];
      function marcar(){ db().collection("solicitudes").doc(id).set({estado:estado,resueltoTs:Date.now()},{merge:true}).then(cargar).catch(function(e){alert(e.message);}); }
      if(estado==="aprobada" && sol && sol.tipo==="vacaciones" && sol.desde && sol.hasta && sol.dni){
        var dias=rangoFechas(sol.desde,sol.hasta);
        if(!dias.length){ alert("La solicitud no tiene fechas válidas; se aprobará sin marcar el roster."); marcar(); return; }
        if(!confirm("Aprobar y marcar "+dias.length+" día(s) como V (vacaciones) en el roster de "+(sol.nombre||sol.dni)+"?")) return;
        var b=db().batch();
        dias.forEach(function(f){ b.set(db().collection("roster").doc(String(sol.dni)+"_"+f), {modulo:"roster",dni:String(sol.dni),nombre:sol.nombre||"",fecha:f,estado:"V"},{merge:true}); });
        b.commit().then(function(){ alert("✓ Aprobada. "+dias.length+" día(s) marcados como V en el roster."); marcar(); }).catch(function(e){ alert("Error al marcar roster: "+e.message); });
        return;
      }
      if(!confirm("¿Marcar como "+estado+"?")) return;
      marcar();
    }
    function cargar(){ db().collection("solicitudes").get().then(function(snap){ SOL=snap.docs.map(function(d){var o=d.data();o._id=d.id;return o;}); pintar(); }).catch(function(e){document.getElementById("sub").textContent="Error: "+e.message;}); }
    document.getElementById("chips").addEventListener("click",function(e){ if(!e.target.classList.contains("chip"))return; document.querySelectorAll("#chips .chip").forEach(function(c){c.classList.remove("on");}); e.target.classList.add("on"); filtro=e.target.dataset.f; pintar(); });
    MISAGI.requireAccess("admin").then(function(s){ document.getElementById("logoutBtn").onclick=function(){MISAGI.logout();}; document.getElementById("app").style.display=""; cargar(); });
  </script>
</body>
</html>
